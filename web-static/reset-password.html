<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
    // Sets the palette before first paint so an explicit preference (see
    // "Palettes" in web-static/README.md) never flashes the wrong one first
    // -- inlined and duplicated per-page rather than an external script,
    // since an external file would itself add a delay this exists to avoid.
    // The "system" default needs no JS at all: style.css's own
    // prefers-color-scheme media query handles it; every OTHER value
    // (light/dark, or a named palette like jade/red-marble/white-marble/
    // high-contrast -- issue #363) is a fixed look applied unconditionally.
    (function () {
        try {
            var theme = localStorage.getItem('themePreference');
            if (theme && theme !== 'system') {
                document.documentElement.dataset.theme = theme;
            }
        } catch (e) {
            // localStorage unavailable (e.g. private browsing) -- falls back
            // to the system default.
        }
    })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password - MoodSwings-Web</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <h1>Reset your password</h1>

        <form id="reset-password-form">
            <div class="field">
                <label for="reset-password-new">New password</label>
                <input type="password" id="reset-password-new" name="password" required autocomplete="new-password" minlength="8" maxlength="72">
            </div>
            <div class="field">
                <label for="reset-password-confirm">Confirm new password</label>
                <input type="password" id="reset-password-confirm" name="password_confirm" required autocomplete="new-password" minlength="8" maxlength="72">
            </div>
            <button type="submit">Reset password</button>
            <p id="reset-password-error" class="error" hidden></p>
            <p id="reset-password-success" class="success" hidden></p>
        </form>

        <p><a href="/">Back to login</a></p>
    </main>

    <dialog id="resources-dialog">
        <button id="resources-close-button" type="button" aria-label="Close">&times;</button>
        <h2>Resources</h2>
        <ul id="resources-list">
            <li><a href="https://magic.wizards.com/en/news/feature/mood-swings-extended-rules" target="_blank" rel="noopener noreferrer">Rules</a></li>
            <li><a href="https://magic.wizards.com/en/news/feature/other-ways-to-play-mood-swings" target="_blank" rel="noopener noreferrer">Formats</a></li>
            <li><a href="https://magic.wizards.com/en/news/feature/mood-swings-card-notes" target="_blank" rel="noopener noreferrer">Card Specific Rulings</a></li>
            <li><a href="https://magic.wizards.com/en/news/card-image-gallery/mood-swings" target="_blank" rel="noopener noreferrer">Card Gallery</a></li>
            <li><a href="https://moodiest.app/" target="_blank" rel="noopener noreferrer">Moodiest (Card Repository)</a></li>
            <li><a href="https://moodswings.scryfall.com/" target="_blank" rel="noopener noreferrer">Moodfall (another Card Repository)</a></li>
            <li><a href="https://discord.gg/GgHFEBAd6C" target="_blank" rel="noopener noreferrer">Discord</a></li>
            <li><a href="https://www.reddit.com/r/moodswingstcg/" target="_blank" rel="noopener noreferrer">Reddit</a></li>
            <li><a href="https://github.com/jceddy/MoodSwings-Web" target="_blank" rel="noopener noreferrer">GitHub repository</a></li>
        </ul>
        <script type="text/javascript" src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js" data-name="bmc-button" data-slug="jceddy" data-color="#FFDD00" data-emoji="" data-font="Cookie" data-text="Buy me a coffee" data-outline-color="#000000" data-font-color="#000000" data-coffee-color="#ffffff"></script>
    </dialog>

    <footer><span id="app-version"></span><a id="resources-link" href="#">Resources</a><label id="theme-select-label">Palette
        <select id="theme-select">
            <optgroup label="Basic">
                <option value="system">System</option>
                <option value="light">Light</option>
                <option value="dark">Dark</option>
            </optgroup>
            <optgroup label="Palettes">
                <option value="jade">Jade</option>
                <option value="red-marble">Red Marble</option>
                <option value="white-marble">White Marble</option>
                <option value="high-contrast">High Contrast</option>
            </optgroup>
        </select>
    </label></footer>
    <script src="js/app.js"></script>
    <script src="js/reset-password.js"></script>
</body>
</html>
