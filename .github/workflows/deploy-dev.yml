name: Deploy to Bluehost (dev)

# Mirrors deploy.yml (production, triggered by main) exactly, aside from
# which branch triggers it and which set of secrets/vars it reads for
# FTP/DB/APP_URL/SITE_URL -- entirely separate DEV_-prefixed names there,
# so setting up (or getting wrong) the dev environment's credentials can
# never touch the already-configured, already-live production FTP/DB
# secrets deploy.yml itself reads. SMTP is the one deliberate exception:
# both workflows read the same plain SMTP_* secrets, since it's just a
# transactional-email sender, not something that differs meaningfully
# between environments (and dev verification emails going out from the
# same configured sender is expected, not a leak of anything sensitive).
# See "Branching & environments" in the top-level README for the
# promotion flow this supports: feature PRs merge into `development`
# (auto-deploying here), and periodically a PR from `development` into
# `main` promotes a batch of changes to production on a more controlled
# schedule.
on:
  push:
    branches: [development]
  # Lets a maintainer re-run a full deploy on demand (e.g. re-testing the
  # migrate/health curl calls against the live dev host) without needing
  # a new commit to trigger the push event above.
  workflow_dispatch: {}

env:
  # Must be >= the "php": ">=8.2" requirement in php-app/composer.json, and
  # should match the PHP version set for your dev domain in cPanel's
  # MultiPHP Manager so the deployed code actually runs the way it was
  # built.
  PHP_VERSION: '8.3'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Job-level (not step-level) so it's readable via the `env` context
      # in a step's own `if:` below -- `secrets` itself isn't a valid
      # named-value inside a step `if:` condition (GitHub Actions rejects
      # the workflow file entirely if you try), so this is the standard
      # workaround: stash the secret in `env` once, then gate on
      # `env.MIGRATION_DEPLOY_KEY != ''` instead of `secrets.MIGRATION_DEPLOY_KEY != ''`.
      MIGRATION_DEPLOY_KEY: ${{ secrets.MIGRATION_DEPLOY_KEY }}
      # Same reasoning, for the "Announce deploy on Discord" step's own
      # `if:` below -- this is the app's own dev-environment Discord
      # bot's token (DEV_DISCORD_BOT_TOKEN, already used above to
      # populate dist/.env), a distinct Discord application from
      # production's own DISCORD_BOT_TOKEN, matching every other
      # DEV_-prefixed Discord secret already in this workflow. Posts into
      # the SAME channel deploy.yml (production) announces into, though
      # -- DISCORD_ANNOUNCE_CHANNEL_ID below is deliberately not
      # DEV_-prefixed, since both this bot and the production one need to
      # be members of that one shared channel with permission to post.
      DISCORD_ANNOUNCE_BOT_TOKEN: ${{ secrets.DEV_DISCORD_BOT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history, not the default shallow (depth-1) clone -- the
          # "Announce deploy on Discord" step below diffs from
          # `github.event.before` (the commit this push moved
          # `development` away from) to `github.sha`, which needs that
          # commit to actually be present locally to walk back to.
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo, pdo_mysql, openssl
          coverage: none

      - name: Install PHP dependencies
        working-directory: php-app
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Assemble deploy artifact
        env:
          DB_HOST: ${{ secrets.DEV_DB_HOST }}
          DB_PORT: ${{ secrets.DEV_DB_PORT }}
          DB_NAME: ${{ secrets.DEV_DB_NAME }}
          DB_USER: ${{ secrets.DEV_DB_USER }}
          DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
          APP_URL: ${{ vars.DEV_APP_URL }}
          SITE_URL: ${{ vars.DEV_SITE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_ENCRYPTION: ${{ secrets.SMTP_ENCRYPTION }}
          SMTP_FROM_ADDRESS: ${{ secrets.SMTP_FROM_ADDRESS }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          DISCORD_CLIENT_ID: ${{ secrets.DEV_DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DEV_DISCORD_CLIENT_SECRET }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DEV_DISCORD_PUBLIC_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DEV_DISCORD_BOT_TOKEN }}
          # MIGRATION_DEPLOY_KEY itself comes from the job-level env above
          # (already in scope here without redeclaring it).
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          # Static site at the domain root.
          cp -R web-static/. dist/

          # The repo-root VERSION file (see "Versioning" in the top-level
          # README) is the single source of truth for the whole site's
          # product version -- deployed alongside index.html so the
          # frontend's own version indicator (web-static/js/app.js) can
          # fetch it as a plain static file, no PHP round trip needed.
          cp VERSION dist/VERSION

          # Bust browser caches on every deploy: filenames never change
          # between deploys, so a browser that already cached an old JS/CSS
          # file (e.g. from before a feature existed) can silently keep
          # serving it even after the HTML referencing it is fresh. Appending
          # the commit SHA to each reference forces a fetch of the new file.
          SHORT_SHA="${GITHUB_SHA:0:8}"
          find dist -name '*.html' -print0 \
            | xargs -0 sed -i -E "s/(src|href)=\"([^\"]+\.(js|css))\"/\1=\"\2?v=${SHORT_SHA}\"/g"

          # PHP app's front controller lives under /app; public/.htaccess
          # rewrites requests to it so index.php's router still works.
          mkdir -p dist/app
          cp -R php-app/public/. dist/app/

          # App code and dependencies, siblings of app/ so index.php's
          # existing dirname(__DIR__) paths resolve unchanged.
          cp -R php-app/src dist/src
          cp -R php-app/vendor dist/vendor

          # Migration files, so the "Run database migrations" step below
          # (a POST /migrate call against the just-deployed app, which has
          # no shell access of its own) can find them via
          # MigrationRunner -- see database/README.md's "Applying
          # migrations". A sibling of dist/src, matching where
          # MigrationRunner::defaultMigrationsDir() looks for it once
          # deployed.
          mkdir -p dist/database
          cp -R database/migrations dist/database/migrations

          # Runtime config generated from repo secrets; never committed. Only
          # write a line when the secret/variable is actually set, so unset
          # optional ones (e.g. SMTP_PORT) fall back to Config::get()'s coded
          # defaults instead of resolving to a literal empty string.
          write_env_var() {
            if [ -n "$2" ]; then
              echo "$1=$2" >> dist/.env
            fi
          }

          : > dist/.env
          write_env_var DB_HOST "$DB_HOST"
          write_env_var DB_PORT "$DB_PORT"
          write_env_var DB_NAME "$DB_NAME"
          write_env_var DB_USER "$DB_USER"
          write_env_var DB_PASSWORD "$DB_PASSWORD"
          write_env_var APP_URL "$APP_URL"
          write_env_var SITE_URL "$SITE_URL"
          write_env_var SMTP_HOST "$SMTP_HOST"
          write_env_var SMTP_PORT "$SMTP_PORT"
          write_env_var SMTP_USERNAME "$SMTP_USERNAME"
          write_env_var SMTP_PASSWORD "$SMTP_PASSWORD"
          write_env_var SMTP_ENCRYPTION "$SMTP_ENCRYPTION"
          write_env_var SMTP_FROM_ADDRESS "$SMTP_FROM_ADDRESS"
          write_env_var SMTP_FROM_NAME "$SMTP_FROM_NAME"
          write_env_var VAPID_PUBLIC_KEY "$VAPID_PUBLIC_KEY"
          write_env_var VAPID_PRIVATE_KEY "$VAPID_PRIVATE_KEY"
          write_env_var VAPID_SUBJECT "$VAPID_SUBJECT"
          write_env_var DISCORD_CLIENT_ID "$DISCORD_CLIENT_ID"
          write_env_var DISCORD_CLIENT_SECRET "$DISCORD_CLIENT_SECRET"
          write_env_var DISCORD_PUBLIC_KEY "$DISCORD_PUBLIC_KEY"
          write_env_var DISCORD_BOT_TOKEN "$DISCORD_BOT_TOKEN"
          write_env_var MIGRATION_DEPLOY_KEY "$MIGRATION_DEPLOY_KEY"

          # dist/, vendor/, src/, and database/ all end up under the shared
          # document root (no Bluehost document-root change required), so
          # block direct HTTP access to the files that aren't meant to be
          # served.
          cat > dist/.htaccess <<'HTACCESS'
          <FilesMatch "^\.env$">
              Require all denied
          </FilesMatch>
          HTACCESS
          echo 'Require all denied' > dist/vendor/.htaccess
          echo 'Require all denied' > dist/src/.htaccess
          echo 'Require all denied' > dist/database/.htaccess

      - name: Deploy to Bluehost via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.DEV_FTP_SERVER }}
          username: ${{ secrets.DEV_FTP_USERNAME }}
          password: ${{ secrets.DEV_FTP_PASSWORD }}
          server-dir: ${{ vars.DEV_FTP_SERVER_DIR || '/public_html/' }}
          local-dir: ./dist/
          exclude: |
            **/.git*
            **/.git*/**

      - name: Run database migrations
        # Both the deployed app's /migrate route AND this secret need to
        # be present for this to do anything -- if MIGRATION_DEPLOY_KEY
        # hasn't been set yet, this step is skipped entirely rather than
        # curling a request that /migrate would just reject with a 403
        # anyway, so a deploy set up before this secret existed keeps
        # working exactly as it did before (falling back to applying
        # database/migrations/ by hand -- see database/README.md). Shares
        # the same MIGRATION_DEPLOY_KEY secret as deploy.yml (production)
        # -- it's a shared deploy-automation credential rather than
        # something meaningfully different per environment, the same
        # reasoning already applied to SMTP_*/VAPID_* above. The real cause
        # of the persistent 406 (found via the diagnostic response-body
        # capture below, added in a prior deploy): it's Bluehost's own
        # mod_security layer, not this app or a missing User-Agent/Accept
        # header -- the response body is literally "This error was
        # generated by Mod_Security." /app/health's plain GET (next step)
        # already succeeds with the same UA/Accept headers, so the one
        # remaining difference was this being a POST with no body and no
        # Content-Type at all; mod_security appears to flag that shape.
        # /migrate itself never reads the request body (only the
        # X-Migration-Key header, see index.php), so a harmless empty JSON
        # object is a safe, inert payload to satisfy it with.
        if: ${{ vars.DEV_SITE_URL != '' && env.MIGRATION_DEPLOY_KEY != '' }}
        env:
          SITE_URL: ${{ vars.DEV_SITE_URL }}
        run: |
          set +e
          http_status=$(curl -sS -o /tmp/migrate_response.txt -D /tmp/migrate_headers.txt -w "%{http_code}" -X POST \
            -A "Mozilla/5.0 (compatible; MoodSwingsCD/1.0)" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "X-Migration-Key: ${MIGRATION_DEPLOY_KEY}" \
            -d '{}' \
            "$SITE_URL/app/migrate")
          echo "HTTP status: $http_status"
          echo "--- response headers ---"
          cat /tmp/migrate_headers.txt
          echo "--- response body ---"
          cat /tmp/migrate_response.txt
          echo "-------------------------"
          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            echo "Migration request failed with HTTP $http_status" >&2
            exit 1
          fi

      - name: Smoke test deployed health endpoint
        if: ${{ vars.DEV_SITE_URL != '' }}
        env:
          SITE_URL: ${{ vars.DEV_SITE_URL }}
        run: |
          curl -fsS \
            -A "Mozilla/5.0 (compatible; MoodSwingsCD/1.0)" \
            -H "Accept: application/json" \
            "$SITE_URL/app/health"

      - name: Announce deploy on Discord
        # Mirrors deploy.yml (production)'s own step exactly, aside from
        # DEV_SITE_URL/"development" here vs SITE_URL/"production" there
        # and using the dev bot's own token (DISCORD_ANNOUNCE_BOT_TOKEN,
        # stashed from DEV_DISCORD_BOT_TOKEN at job level above) -- see
        # that step's own comment for the full rationale (why this is
        # gated on success() implicitly, why it posts directly rather
        # than through DiscordNotificationChannel.php's DM-only path, and
        # why it no-ops entirely rather than failing when unconfigured).
        # DISCORD_ANNOUNCE_CHANNEL_ID is deliberately the SAME repo
        # variable deploy.yml reads -- both bots post into one shared
        # channel, so a reader sees dev and production deploys together
        # in one place rather than needing to watch two channels.
        if: ${{ vars.DEV_SITE_URL != '' && vars.DISCORD_ANNOUNCE_CHANNEL_ID != '' && env.DISCORD_ANNOUNCE_BOT_TOKEN != '' }}
        env:
          SITE_URL: ${{ vars.DEV_SITE_URL }}
          DISCORD_ANNOUNCE_CHANNEL_ID: ${{ vars.DISCORD_ANNOUNCE_CHANNEL_ID }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"

          # Filters out bare "Bump VERSION to X.Y.Z" commits from the
          # announcement -- via each commit's SUBJECT line only (%s), not
          # `git log --grep` (which scans the whole message body too, and
          # so used to wrongly drop an entire commit whenever a real,
          # substantive change's body happened to mention bumping the
          # version alongside it) -- see deploy.yml's own copy of this
          # step for the full incident writeup. Each `|| true` guards
          # against `grep -v` exiting 1 when every commit in range was a
          # bare version bump (nothing left after filtering), which under
          # `set -o pipefail` would otherwise trip `set -e` instead of
          # falling through to the "no new commits" fallback below.
          #
          # --reverse: `git log` defaults to newest-first, which read as
          # backwards here -- a bullet list where an EARLIER line
          # mentions something not explained until a LATER line, because
          # "later" in the list actually meant "committed earlier". This
          # lists commits oldest-first instead, i.e. in implementation
          # order, matching the order the changes actually happened in
          # -- see deploy.yml's own copy of this step for the same fix.
          BEFORE_SHA="${{ github.event.before }}"
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            CHANGES_FULL="$(git log --no-merges --reverse -1 --pretty=format:'%s' | grep -v '^Bump VERSION to ' | sed 's/^/- /' || true)"
          else
            CHANGES_FULL="$(git log --no-merges --reverse --pretty=format:'%s' "${BEFORE_SHA}..${GITHUB_SHA}" | grep -v '^Bump VERSION to ' | sed 's/^/- /' || true)"
          fi
          if [ -z "$CHANGES_FULL" ]; then
            CHANGES_FULL="- (no new commits since the last deploy)"
          fi

          # Keeps the last 15 (tail, not head) -- since CHANGES_FULL is
          # oldest-first per --reverse above, the last 15 are the MOST
          # RECENT commits, the ones most worth keeping visible when
          # something has to be cut. The omitted-count note goes BEFORE
          # those 15 rather than trailing after them, since it stands for
          # commits that chronologically precede everything actually
          # listed.
          CHANGES="$(printf '%s\n' "$CHANGES_FULL" | tail -n 15)"
          TOTAL_LINES=$(printf '%s\n' "$CHANGES_FULL" | wc -l)
          if [ "$TOTAL_LINES" -gt 15 ]; then
            CHANGES="$(printf -- '- …and %d earlier commit(s)\n%s' "$((TOTAL_LINES - 15))" "$CHANGES")"
          fi

          CONTENT="$(printf '🚀 **MoodSwings** \`%s\` deployed to development: %s\n\n%s' "$VERSION" "$SITE_URL" "$CHANGES")"
          PAYLOAD="$(jq -n --arg content "$CONTENT" '{content: $content}')"

          curl -fsS -X POST \
            -H "Authorization: Bot ${DISCORD_ANNOUNCE_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://discord.com/api/v10/channels/${DISCORD_ANNOUNCE_CHANNEL_ID}/messages"
